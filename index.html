<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b1d14" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Wayang Bali</title>
  </head>
  <body>
    <main id="app" aria-label="Wayang Bali">
      <video id="camera-preview" autoplay muted playsinline hidden aria-label="Mirrored camera preview"></video>
      <div id="ui" class="screen" role="region" aria-label="Kontrol wayang">Memuat aplikasi...</div>
    </main>
    <section id="download-screen" aria-live="polite" aria-label="Persiapan aplikasi">
      <div class="download-card">
        <svg class="download-mark" viewBox="12 4 40 55" aria-hidden="true">
          <path d="M32 6C38 15 50 27 50 39.5C50 48 43 52 32 52C21 52 14 48 14 39.5C14 27 26 15 32 6ZM24 51h16l2 6H22z"/>
          <path d="M32 47V20M32 38L23.5 32M32 38L40.5 32M32 29.5L26 25M32 29.5L38 25" fill="none" stroke="#f3d39a" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <h1 id="download-title">Mohon tunggu, sedang menyiapkan aset dan aplikasi</h1>
        <p id="download-status">Memeriksa paket aplikasi…</p>
        <p id="download-percent" aria-hidden="true">0%</p>
        <div class="download-track" role="progressbar" aria-label="Progres unduhan" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="download-progress"></span>
        </div>
        <p id="download-detail" class="download-detail">Mohon jangan tutup halaman ini.</p>
        <button id="download-retry" type="button" hidden>Coba lagi</button>
      </div>
    </section>
    <style>
      #download-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;color:#eadbc2;background:radial-gradient(ellipse 60% 50% at 50% 38%,#5a3b22 0%,#3d2a1c 40%,#2b1d14 75%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:opacity .35s ease}
      #download-screen.is-hidden{opacity:0;pointer-events:none}
      .download-card{width:min(420px,100%);text-align:center}
      .download-mark{display:block;width:clamp(64px,14vw,84px);margin:0 auto 22px;fill:#2b1d14;filter:drop-shadow(0 0 28px #f6d79a99);background:radial-gradient(circle at 50% 60%,#fff4d9 0,#e3b77a 45%,transparent 70%);border-radius:50%;padding:14px}
      #download-title{margin:0;font:600 clamp(30px,7vw,42px)/1.05 'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
      #download-status{min-height:22px;margin:10px 0 18px;color:#bba98d;font-size:14px;line-height:1.5}
      #download-percent{margin:0 0 10px;color:#d4ae61;font:600 clamp(44px,10vw,60px)/1 'Cormorant Garamond',Georgia,serif;font-variant-numeric:tabular-nums}
      .download-track{height:12px;overflow:hidden;border-radius:999px;background:repeating-linear-gradient(90deg,#3c341426 0 1px,transparent 1px 9px),linear-gradient(180deg,#8e8a55,#6d6838);box-shadow:inset 0 1px 3px #0006}
      #download-progress{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#a87826,#d4ae61 70%,#fff4d9);box-shadow:0 0 12px #ffe4a0b3}
      .download-detail{margin:12px 0 0;color:#bba98d;font-size:13px;font-variant-numeric:tabular-nums}
      #download-retry{min-height:46px;margin-top:20px;padding:11px 24px;border:1px solid #d4ae61;border-radius:999px;background:#d4ae61;color:#2b1d14;font:600 15px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}
      #download-retry:focus-visible{outline:3px solid #f2c46b;outline-offset:3px}
    </style>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
